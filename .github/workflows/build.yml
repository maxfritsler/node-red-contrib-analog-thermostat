name: Build Package (manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: Install dependencies (if any)
        run: npm install --production || true

      - name: Pack module
        id: pack
        run: |
          PACK_FILE=$(npm pack --dry-run 2>/dev/null | tail -1)
          echo "pack_file=$PACK_FILE" >> $GITHUB_OUTPUT
          npm pack

      - name: List files after pack (debug)
        run: ls -la *.tgz || echo "No .tgz file found"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: analog-thermostat-package
          path: ${{ steps.pack.outputs.pack_file }}
