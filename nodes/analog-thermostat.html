<script type="text/javascript">
    RED.nodes.registerType('analog-thermostat', {
        category: 'home automation',
        color: '#E6A23C',
        defaults: {
            name: { value: "" },
            mode: { value: "heat" },
            precision: { value: 0.5 },
            minTemp: { value: 15, validate: RED.validators.number() },
            maxTemp: { value: 25, validate: RED.validators.number() },
            targetTemp: { value: 21, validate: RED.validators.number() },
            hysteresis: { value: 0.2, validate: RED.validators.number() },
            sampleInterval: { value: 60, validate: RED.validators.number() },
            learningEnabled: { value: true },
            maxOutputChange: { value: 0.5, validate: RED.validators.number() },
            outputMapping: { value: "direct" },
            roundToInteger: { value: true },
            operatingMode: { value: "manual" },
            awayTemp: { value: 16, validate: RED.validators.number() },
            scheduleEnabled: { value: false },
            scheduleConfig: { value: null },
            scheduleTimezone: { value: "local" },
            mqttBroker: { value: "", type: "mqtt-broker" },
            mqttDiscovery: { value: true },
            mqttBaseTopic: { value: "homeassistant" },
            mqttUniqueId: { value: "" },
            mqttDeviceName: { value: "Analog Thermostat" },
            mqttManufacturer: { value: "Node-RED" },
            mqttModel: { value: "Analog Thermostat" }
        },
        inputs: 1,
        outputs: 3,
        icon: "thermometer.svg",
        inputLabels: "температура / setpoint / mode",
        outputLabels: ["0-100%", "debug / status", "active regulation"],
        label: function() {
            return this.name || "analog thermostat";
        },
        paletteLabel: "analog thermostat (0-100%)",
        oneditprepare: function() {
            var node = this;
            var editorPanel = $("#dialog-form");

            // ---- Ручное переключение вкладок ----
            var tabHeaders = editorPanel.find('.node-input-tab-headers li');
            var tabContents = editorPanel.find('.node-input-tab-contents .tab-content');

            tabHeaders.on('click', function() {
                var targetId = $(this).data('tab');
                tabHeaders.removeClass('active');
                $(this).addClass('active');
                tabContents.hide();
                editorPanel.find('#' + targetId).show();
            });

            // Если какая-то вкладка активна по умолчанию — показываем её
            var activeTab = editorPanel.find('.node-input-tab-headers li.active');
            if (activeTab.length) {
                var defaultTab = activeTab.data('tab');
                tabContents.hide();
                editorPanel.find('#' + defaultTab).show();
            } else {
                // первая по умолчанию
                tabHeaders.first().addClass('active');
                tabContents.hide();
                editorPanel.find('#' + tabHeaders.first().data('tab')).show();
            }

            // ---- Валидация температур ----
            function validateTemps() {
                var min = parseFloat(editorPanel.find("#node-input-minTemp").val());
                var max = parseFloat(editorPanel.find("#node-input-maxTemp").val());
                var target = parseFloat(editorPanel.find("#node-input-targetTemp").val());

                if (min >= max) {
                    editorPanel.find("#temp-warning").text("Предупреждение: минимум должен быть меньше максимума").show();
                } else if (target < min || target > max) {
                    editorPanel.find("#temp-warning").text("Предупреждение: целевая температура вне диапазона").show();
                } else {
                    editorPanel.find("#temp-warning").hide();
                }
            }

            editorPanel.find("#node-input-minTemp, #node-input-maxTemp, #node-input-targetTemp").on('change', validateTemps);
            validateTemps();

            // ---- Помощь по маппингу ----
            editorPanel.find("#node-input-outputMapping").on('change', function() {
                var val = $(this).val();
                if (val === 'direct') {
                    editorPanel.find("#mapping-help").text('0% = minTemp, 100% = maxTemp (для нагрева)');
                } else {
                    editorPanel.find("#mapping-help").text('100% = minTemp, 0% = maxTemp (для охлаждения)');
                }
            }).trigger('change');

            // ---- Скрыть/показать расписание ----
            function toggleSchedule() {
                var enabled = editorPanel.find("#node-input-scheduleEnabled").is(":checked");
                editorPanel.find(".schedule-config").toggle(enabled);
            }
            editorPanel.find("#node-input-scheduleEnabled").on('change', toggleSchedule);
            toggleSchedule();

            // ---- Поле выбора MQTT брокера ----
            // (ничего дополнительно не требуется, т.к. тип "mqtt-broker" уже даёт выпадающий список)
        }
    });
</script>

<script type="text/html" data-template-name="analog-thermostat">
    <style>
        .node-input-tab-headers {
            list-style: none;
            padding: 0;
            margin: 0 0 10px 0;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 0;
        }
        .node-input-tab-headers li {
            padding: 8px 16px;
            cursor: pointer;
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-bottom: none;
            border-radius: 4px 4px 0 0;
            margin-right: 4px;
            font-weight: normal;
            transition: background 0.2s;
        }
        .node-input-tab-headers li:hover {
            background: #e8e8e8;
        }
        .node-input-tab-headers li.active {
            background: #fff;
            font-weight: bold;
            border-bottom: 1px solid #fff;
            margin-bottom: -1px;
        }
        .node-input-tab-contents .tab-content {
            padding: 10px 0;
        }
        .node-input-tab-contents .tab-content:not(:first-of-type) {
            display: none;
        }
        .schedule-config {
            margin-top: 10px;
        }
        #temp-warning {
            color: #ff9800;
            display: none;
            margin-bottom: 10px;
        }
        .form-row {
            margin-bottom: 10px;
        }
    </style>

    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Имя</label>
        <input type="text" id="node-input-name" placeholder="Имя узла">
    </div>

    <div class="node-input-tabs">
        <ul class="node-input-tab-headers">
            <li data-tab="tab-settings" class="active">Настройки</li>
            <li data-tab="tab-schedule">Расписание</li>
            <li data-tab="tab-mqtt">MQTT Discovery</li>
        </ul>
        <div class="node-input-tab-contents">
            <!-- ========== Вкладка "Настройки" ========== -->
            <div id="tab-settings" class="tab-content" style="display:block;">
                <div class="form-row">
                    <label for="node-input-mode"><i class="fa fa-thermometer"></i> Режим</label>
                    <select id="node-input-mode">
                        <option value="heat">Heat (нагрев)</option>
                        <option value="cool">Cool (охлаждение)</option>
                        <option value="heat_cool">Heat/Cool (авто)</option>
                    </select>
                </div>

                <div class="form-row">
                    <label for="node-input-precision"><i class="fa fa-bullseye"></i> Точность</label>
                    <select id="node-input-precision">
                        <option value="1">1.0 °C</option>
                        <option value="0.5">0.5 °C</option>
                        <option value="0.2">0.2 °C</option>
                        <option value="0.1">0.1 °C</option>
                    </select>
                </div>

                <div class="form-row">
                    <label for="node-input-minTemp"><i class="fa fa-arrow-down"></i> Мин. температура</label>
                    <input type="number" id="node-input-minTemp" step="0.1" min="-50" max="50">
                </div>

                <div class="form-row">
                    <label for="node-input-maxTemp"><i class="fa fa-arrow-up"></i> Макс. температура</label>
                    <input type="number" id="node-input-maxTemp" step="0.1" min="-50" max="50">
                </div>

                <div class="form-row">
                    <label for="node-input-targetTemp"><i class="fa fa-bullseye"></i> Целевая температура</label>
                    <input type="number" id="node-input-targetTemp" step="0.1" min="-50" max="50">
                </div>

                <div id="temp-warning"></div>

                <div class="form-row">
                    <label for="node-input-hysteresis"><i class="fa fa-arrows-h"></i> Гистерезис</label>
                    <input type="number" id="node-input-hysteresis" step="0.1" min="0" max="5">
                </div>

                <div class="form-row">
                    <label for="node-input-sampleInterval"><i class="fa fa-clock-o"></i> Интервал выборки (сек)</label>
                    <input type="number" id="node-input-sampleInterval" step="1" min="1">
                </div>

                <div class="form-row">
                    <label for="node-input-maxOutputChange"><i class="fa fa-exchange"></i> Макс. изменение за цикл (°C)</label>
                    <input type="number" id="node-input-maxOutputChange" step="0.1" min="0.1" max="10">
                </div>

                <div class="form-row">
                    <label for="node-input-learningEnabled"><i class="fa fa-graduation-cap"></i> Автообучение PID</label>
                    <input type="checkbox" id="node-input-learningEnabled" style="width: auto;">
                </div>

                <hr style="border-top: 1px solid #ccc; margin: 15px 0;">

                <div class="form-row">
                    <label for="node-input-outputMapping"><i class="fa fa-arrows-h"></i> Маппинг 0–100%</label>
                    <select id="node-input-outputMapping">
                        <option value="direct">Прямой (0% = min, 100% = max)</option>
                        <option value="inverse">Инверсный (100% = min, 0% = max)</option>
                    </select>
                    <span id="mapping-help" style="font-size: 0.8em; color: #888; margin-left: 10px;"></span>
                </div>

                <div class="form-row">
                    <label for="node-input-roundToInteger"><i class="fa fa-calculator"></i> Округлять до целого</label>
                    <input type="checkbox" id="node-input-roundToInteger" style="width: auto;">
                </div>

                <hr style="border-top: 1px solid #ccc; margin: 15px 0;">

                <div class="form-row">
                    <label for="node-input-operatingMode"><i class="fa fa-sliders"></i> Режим работы</label>
                    <select id="node-input-operatingMode">
                        <option value="manual">Ручной</option>
                        <option value="schedule">По расписанию</option>
                        <option value="off">Выключен</option>
                    </select>
                </div>

                <div class="form-row">
                    <label for="node-input-awayTemp"><i class="fa fa-home"></i> Away температура</label>
                    <input type="number" id="node-input-awayTemp" step="0.1" min="-50" max="50">
                </div>
            </div>

            <!-- ========== Вкладка "Расписание" ========== -->
            <div id="tab-schedule" class="tab-content" style="display:none;">
                <div class="form-row">
                    <label for="node-input-scheduleEnabled"><i class="fa fa-calendar"></i> Включить расписание</label>
                    <input type="checkbox" id="node-input-scheduleEnabled" style="width: auto;">
                </div>

                <div class="schedule-config" style="display: none; margin-top: 10px;">
                    <div class="form-row">
                        <label for="node-input-scheduleTimezone"><i class="fa fa-globe"></i> Часовой пояс</label>
                        <select id="node-input-scheduleTimezone">
                            <option value="local">Локальный</option>
                            <option value="UTC">UTC</option>
                            <option value="Europe/Moscow">Europe/Moscow</option>
                            <option value="Europe/London">Europe/London</option>
                            <option value="America/New_York">America/New_York</option>
                        </select>
                    </div>

                    <div style="background: #f5f5f5; padding: 10px; border-radius: 4px; margin-top: 10px;">
                        <p style="margin: 0; font-size: 0.9em; color: #666;">
                            <i class="fa fa-info-circle"></i> Расписание задаётся через <code>msg.schedule</code>.
                            Формат: <code>{ monday: [{time: "06:00", temp: 21}, ...], default: 19 }</code>
                        </p>
                    </div>
                </div>
            </div>

            <!-- ========== Вкладка "MQTT Discovery" ========== -->
            <div id="tab-mqtt" class="tab-content" style="display:none;">
                <div class="form-row">
                    <label for="node-input-mqttBroker"><i class="fa fa-server"></i> MQTT Брокер</label>
                    <input type="text" id="node-input-mqttBroker" placeholder="выберите брокер...">
                    <span style="font-size: 0.8em; color: #888;">(узел MQTT брокера)</span>
                </div>

                <div class="form-row">
                    <label for="node-input-mqttDiscovery"><i class="fa fa-rocket"></i> Включить Discovery</label>
                    <input type="checkbox" id="node-input-mqttDiscovery" style="width: auto;">
                </div>

                <div class="form-row">
                    <label for="node-input-mqttBaseTopic"><i class="fa fa-tag"></i> Базовый топик</label>
                    <input type="text" id="node-input-mqttBaseTopic" placeholder="homeassistant">
                </div>

                <div class="form-row">
                    <label for="node-input-mqttUniqueId"><i class="fa fa-id-card"></i> Уникальный ID</label>
                    <input type="text" id="node-input-mqttUniqueId" placeholder="оставьте пустым для автогенерации">
                </div>

                <div class="form-row">
                    <label for="node-input-mqttDeviceName"><i class="fa fa-tag"></i> Имя устройства</label>
                    <input type="text" id="node-input-mqttDeviceName" placeholder="Analog Thermostat">
                </div>

                <div class="form-row">
                    <label for="node-input-mqttManufacturer"><i class="fa fa-building"></i> Производитель</label>
                    <input type="text" id="node-input-mqttManufacturer" placeholder="Node-RED">
                </div>

                <div class="form-row">
                    <label for="node-input-mqttModel"><i class="fa fa-cube"></i> Модель</label>
                    <input type="text" id="node-input-mqttModel" placeholder="Analog Thermostat">
                </div>

                <div style="background: #f5f5f5; padding: 10px; border-radius: 4px; margin-top: 10px;">
                    <p style="margin: 0; font-size: 0.9em; color: #666;">
                        <i class="fa fa-info-circle"></i> После включения Discovery, Home Assistant автоматически создаст климат-устройство.
                        Команды: <code>set_temperature</code>, <code>set_mode</code>, а также <code>set_operating_mode</code>, <code>set_away</code>, <code>set_boost</code> в топиках <code>climate/&lt;unique_id&gt;/set_*</code>.
                    </p>
                </div>
            </div>
        </div>
    </div>
</script>

<script type="text/html" data-help-name="analog-thermostat">
    <p>Адаптивный PID-термостат с аналоговым выходом 0–100% и MQTT Discovery для Home Assistant.</p>
    <h3>Вход</h3>
    <ul>
        <li><b>msg.payload</b> (number) — текущая температура (обязательно)</li>
        <li><b>msg.setpoint</b> (number) — переопределение целевой температуры</li>
        <li><b>msg.mode</b> (string) — <code>heat</code>, <code>cool</code>, <code>heat_cool</code></li>
        <li><b>msg.operatingMode</b> (string) — <code>manual</code>, <code>schedule</code>, <code>off</code></li>
        <li><b>msg.schedule</b> (object) — расписание</li>
        <li><b>msg.boost</b> (object/boolean) — <code>{temp: 24, duration: 60}</code> или <code>false</code></li>
        <li><b>msg.away</b> (boolean/number) — <code>true</code>, <code>false</code> или температура</li>
    </ul>
    <h3>Выход 1 — Аналоговый сигнал 0–100%</h3>
    <p><b>msg.payload</b> — число от 0 до 100.</p>
    <h3>Выход 2 — Отладка</h3>
    <p><b>msg.payload</b> — объект с текущей температурой, целевой, ошибкой, PID-коэффициентами и т.д.</p>
    <h3>Выход 3 — Активность</h3>
    <p><b>msg.payload</b> — <code>true</code> (активно регулирует) или <code>false</code>.</p>
    <h3>MQTT Discovery</h3>
    <p>При включении и настройке брокера узел публикует конфигурацию для Home Assistant.
       Команды принимаются в топиках:</p>
    <ul>
        <li><code>climate/&lt;unique_id&gt;/set_temp</code> — установка температуры</li>
        <li><code>climate/&lt;unique_id&gt;/set_mode</code> — режим (heat/cool/heat_cool/off)</li>
        <li><code>climate/&lt;unique_id&gt;/set_operating_mode</code> — manual/schedule/off</li>
        <li><code>climate/&lt;unique_id&gt;/set_away</code> — true/false или температура</li>
        <li><code>climate/&lt;unique_id&gt;/set_boost</code> — JSON <code>{"temp":24,"duration":60}</code> или число (температура, длительность 60)</li>
    </ul>
    <p>Состояние публикуется в топик <code>climate/&lt;unique_id&gt;/state</code> (JSON) и отдельные топики.</p>
</script>
